name: Bug report
description: Report reproducible NewBridge behavior
body:
  - type: input
    id: version
    attributes: { label: NewBridge version }
    validations: { required: true }
  - type: input
    id: snow
    attributes: { label: ServiceNow release family }
  - type: textarea
    id: repro
    attributes: { label: Reproduction, description: Do not include credentials or customer data. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
